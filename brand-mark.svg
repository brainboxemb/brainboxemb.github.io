<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">brainboxemb brand mark</title>
  <desc id="desc">Cyan b and luminous isometric box on a dark navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b3154"/><stop offset="1" stop-color="#061b33"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9ff0ff"/><stop offset="1" stop-color="#39bfea"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
